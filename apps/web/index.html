<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 개인 전용 앱 — 검색엔진 색인 대상이 아니다 -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Ratatouille</title>
    <meta name="title" content="Ratatouille" />
    <meta
      name="description"
      content="회의 녹음부터 전사 교정, AI 정리와 확정까지 이어지는 개인 워크스페이스."
    />

    <!--
      Pretendard — 자체 호스팅. 홈서버 개인 앱이라 인터넷 없이도 떠야 한다.
      가변 폰트 한 벌이라 preload도 하나면 된다.
    -->
    <link
      rel="preload"
      href="/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
